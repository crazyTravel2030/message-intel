server:
  port: 8080

spring:
  application:
    name: intel-gateway
  cloud:
    gateway:
      routes:
        - id: ingest-api
          uri: lb://intel-ingest
          predicates:
            - Path=/api/ingest/**
        - id: search-api
          uri: lb://intel-search
          predicates:
            - Path=/api/search/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
